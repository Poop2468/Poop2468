<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Delphi 3D Portfolio</title>
  <style>
    body { margin: 0; font-family: sans-serif; overflow-x: hidden; }
    .hero { position: relative; height: 400px; background: black; }
    canvas { display: block; }
    #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#fff; display:flex; justify-content:center; align-items:center; font-size:2em; z-index:9999; transition:0.5s; }
    #loader.hidden { opacity:0; pointer-events:none; }
  </style>
</head>
<body>
  <div id="loader">Loading...</div>
  <div class="hero">
    <canvas id="cute3d"></canvas>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/loaders/GLTFLoader.js"></script>

  <!-- Main JS -->
  <script src="main.js"></script>
</body>
</html>

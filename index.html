<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delphi Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 로딩 화면 -->
  <div id="loader">Loading...</div>

  <!-- Hero 섹션 -->
  <section class="hero">
    <h1>Delphi</h1>
    <canvas id="cute3d"></canvas>
  </section>

  <!-- About, Works, Contact 섹션 예시 -->
  <section class="about">
    <h2>About Me</h2>
    <p>3D 모델러 Delphi의 포트폴리오</p>
  </section>

  <section class="works">
    <h2>Works</h2>
    <p>작품 소개</p>
  </section>

  <section class="contact">
    <h2>Contact</h2>
    <p>문의하기</p>
  </section>

  <!-- 배경음악 -->
  <audio id="bgMusic" loop autoplay>
    <source src="audio/ambient.mp3" type="audio/mpeg">
    브라우저가 audio 태그를 지원하지 않습니다.
  </audio>

  <!-- 음악 볼륨 조절 -->
  <div id="musicControl" style="position:fixed;bottom:20px;right:20px;background:#fff;opacity:0.8;padding:10px;border-radius:8px;">
    <label for="volumeSlider">볼륨</label>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.3">
  </div>

  <!-- 스크립트 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="main.js"></script>
</body>
</html>
